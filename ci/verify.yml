name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # fork-PR guard: never run untrusted fork code on the self-hosted fleet
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, lufs]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install system dependencies (python3.12, ffmpeg)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3.12 python3.12-venv ffmpeg

      - name: Create venv and install tscribe (all extras + dev)
        run: |
          python3.12 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: ruff check
        run: |
          . .venv/bin/activate
          ruff check .

      - name: ruff format --check
        run: |
          . .venv/bin/activate
          ruff format --check .

      - name: pytest
        run: |
          . .venv/bin/activate
          PYTHONPATH=src pytest tests/ -v
