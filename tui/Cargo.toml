[package]
name = "tscribe-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Terminal monitor for a tscribe transcription job (polls GET /jobs/{id}). Not a control surface -- start jobs via curl/the tscribe CLI."
license = "GPL-3.0-or-later"
repository = "https://github.com/lufs-audio/tscribe"
authors = ["Daniel Ramirez <danialrami>"]
readme = "README.md"
keywords = ["transcription", "cli", "tui", "monitor"]
categories = ["command-line-utilities"]

# Lives in this Python repo's `tui/` subdirectory as an independent Rust crate
# (see `tui/README.md` for why) -- not part of the `tscribe` Python package's
# own build (`uv sync` / `pyproject.toml`) and not wired into that CLI at all.
# Build/run it directly with cargo from within this directory.

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# No web-framework/HTTP-client crate, matching lufs-audio/lrex's `serve` and
# its own `tui`'s SSE client: a small, hand-rolled request over std::net is
# enough for one polled GET per tick, and keeps this a two-dependency (plus
# clap/serde) terminal binary rather than pulling in a full async HTTP stack
# for a job-status monitor.
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
opt-level = 3
lto = true
