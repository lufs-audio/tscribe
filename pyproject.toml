[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tscribe"
version = "0.1.0"
description = "Agent-first transcription primitive (client + server + bootstrap) — unifies tscribe-class-carnyx, tscribe-transcription-tool, and tscribe-capture-rig. See SPEC.md."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Daniel Ramirez" }
]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.scripts]
tscribe = "tscribe.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
